services:
  db:
    image: postgres:16-alpine
    container_name: mwi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multiwarehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: mwi-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=multiwarehouse;Username=postgres;Password=postgres"
      Cors__Origins__0: "http://localhost:3000"
      Cors__Origins__1: "http://localhost"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: mwi-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
