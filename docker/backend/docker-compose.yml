version: "3.8"
services:
  mysql-db:
    image: mysql:8.0
    container_name: multi_warehouse_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: MultiWarehouseDb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  webapi:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: multi_warehouse_api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql-db;Port=3306;Database=MultiWarehouseDb;Uid=root;Pwd=admin123;
    depends_on:
      - mysql-db

volumes:
  mysql_data:
